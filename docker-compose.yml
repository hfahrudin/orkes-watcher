services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      ORKES_DATABASE_URL: postgresql+asyncpg://orkes:orkes@postgres:5432/orkes
      ORKES_MINIO_ENDPOINT: minio:9000
      ORKES_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-orkes}
      ORKES_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-orkes12345}
      ORKES_MINIO_SECURE: "false"
      ORKES_MINIO_BUCKET: orkes-traces
      ORKES_BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@orkes.local}
      ORKES_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-changeme}
      ORKES_CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-8080}"]'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orkes
      POSTGRES_PASSWORD: orkes
      POSTGRES_DB: orkes
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orkes"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orkes}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orkes12345}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
